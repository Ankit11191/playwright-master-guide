<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background squircle for Android -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <circle cx="256" cy="256" r="200" fill="url(#pw-grad)" filter="url(#shadow)" />
  
  <!-- Modern PW Monogram / Robot Playwright Brand Graphic -->
  <g fill="#ffffff" transform="translate(106, 126)">
    <!-- Play symbol combined with letter P & W -->
    <path d="M40 30 L40 230 L110 230 L110 160 L160 160 C200 160 220 140 220 95 C220 50 200 30 160 30 Z M110 80 L150 80 C165 80 170 85 170 95 C170 105 165 110 150 110 L110 110 Z" />
    <!-- Secondary W / checkmark element -->
    <path d="M190 120 L230 230 L270 120 L300 230 L310 190 L290 120 L260 210 L230 120 Z" fill="#a7f3d0" />
  </g>
</svg>
